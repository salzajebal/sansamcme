kind = "web"
previewPath = "/"
title = "CME Group - E-mini Nasdaq-100"
version = "1.0.0"
id = "artifacts/cme-group"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23922

[services.development]
run = "pnpm --filter @workspace/cme-group run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cme-group", "run", "build" ]
publicDir = "artifacts/cme-group/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23922"
BASE_PATH = "/"
